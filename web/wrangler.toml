# strata Worker: README images at /owner/repo.svg plus the gallery site.
# Setup: ../deploy/README.md. Deploy: npm run deploy
name = "strata"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true   # served at strata.<subdomain>.workers.dev
preview_urls = false # no per-version preview addresses

# The gallery site. Requests that match a file are served directly;
# everything else (the SVG routes) runs the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "SVGS"
id = "beaee8ea8b7343f986d550dc7730fe9f" # the same namespace strata-server writes to

[vars]
SERVER_URL = "https://strata-server-5vo0.onrender.com" # no trailing slash
MAX_REPO_MB = "300"

# Secrets, set once with `npx wrangler secret put NAME`:
#   STRATA_SECRET  the same value as on Render
#   GITHUB_TOKEN   read-only token for public repositories
